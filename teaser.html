<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salfer Eco-Tycoon Teaser</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            position: relative;
        }

        .background {
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1200&h=630&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            filter: brightness(0.6) contrast(1.2);
            z-index: 1;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 255, 159, 0.5);
        }

        h1 {
            font-size: 84px;
            color: #00ff9f;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 10px;
            line-height: 1;
            filter: drop-shadow(0 0 15px rgba(0, 255, 159, 0.8));
        }

        p {
            font-size: 28px;
            color: #fff;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.9;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 400px;
            background: rgba(0, 255, 159, 0.1);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 3;
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="glow"></div>

    <div class="content">
        <h1>SALFER ECO-TYCOON</h1>
        <p>THE MASSIVE LAUNCH IS COMING</p>
    </div>
</body>

</html>
